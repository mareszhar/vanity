catalogMode: strict
blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true

# Reviewed editor backend; keep the release-age exception version-specific.
minimumReleaseAgeExclude:
  - '@mszr/selenita@0.4.1'

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - undici-types
  # chokidar 4.x dropped provenance attestation; required by @pandacss/node (demo-comparisons)
  - chokidar
  # cssnano 9 drops 8.x's maintainer approval; trusted publisher and cssnano's
  # main publish workflow verified. Remove when approval returns or Nuxt leaves 9.
  - cssnano@9.4.0
  - cssnano-preset-default@9.4.0
  - stylehacks@9.0.8
  - postcss-unique-selectors@9.0.6
  - postcss-svgo@9.0.5
  - postcss-reduce-transforms@9.0.5
  - postcss-reduce-initial@9.0.7
  - postcss-ordered-values@9.0.8
  - postcss-normalize-whitespace@9.0.6
  - postcss-normalize-url@9.0.6
  - postcss-normalize-unicode@9.0.6
  - postcss-normalize-timing-functions@9.0.6
  - postcss-normalize-string@9.0.6
  - postcss-normalize-repeat-style@9.0.6
  - postcss-normalize-positions@9.0.7
  - postcss-normalize-display-values@9.0.6
  - postcss-normalize-charset@9.0.6
  - postcss-minify-selectors@9.0.7
  - postcss-minify-params@9.0.7
  - postcss-minify-gradients@9.0.7
  - postcss-minify-font-values@9.0.8
  - postcss-merge-rules@9.1.3
  - postcss-merge-longhand@9.3.0
  - postcss-discard-overridden@9.0.6
  - postcss-discard-empty@9.0.7
  - postcss-discard-duplicates@9.0.6
  - postcss-discard-comments@9.0.7
  - postcss-convert-values@9.0.8
  - postcss-colormin@9.0.7
  - cssnano-utils@8.2.1

shellEmulator: true

# A git hook has no TTY, so pnpm's pre-run dependency check can abort a commit
# when it decides to auto-install. Keep runs clean and installs explicit;
# dependency integrity is gated by `pnpm install --frozen-lockfile` in `check`
# and in CI, which fails on real lockfile/manifest drift rather than on a
# benign manifest bump.
verifyDepsBeforeRun: false

packages:
  - sdk
  - sandbox/fixtures
  - sandbox/canary
  - sandbox/demo-main
  - sandbox/demo-comparisons
  - spikes/*

# Panda 1.12 pins these versions below their published security fixes.
overrides:
  browserslist@4.28.1: 4.29.2
  postcss-selector-parser@7.1.1: 7.1.6

  postcss@8.5.14: 8.5.28

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@clack/prompts': ^1.8.1
  '@mszr/selenita': ^0.4.1
  '@nuxt/kit': 4.5.2
  '@nuxt/schema': 4.5.2
  '@pandacss/dev': ^1.12.1
  '@playwright/test': ^1.63.0
  '@tailwindcss/vite': ^4.3.3
  '@types/css-tree': 3.2.0
  '@types/culori': ^4.0.1
  '@types/node': ^26.6.3
  '@vanilla-extract/css': ^1.21.2
  '@vanilla-extract/dynamic': ^2.1.5
  '@vanilla-extract/integration': ^8.0.10
  '@vanilla-extract/recipes': ^0.5.7
  '@vanilla-extract/vite-plugin': 5.2.6
  '@vitejs/devtools': 0.7.6
  '@vitejs/devtools-kit': 0.7.6
  '@vitejs/devtools-vite': 0.7.6
  '@vitejs/plugin-vue': ^6.0.9
  '@vue/language-plugin-pug': ^3.3.11
  '@webref/css': 8.7.5
  ajv: ^8.20.0
  css-tree: 3.2.1
  csstype: ^3.2.3
  culori: ^4.0.2
  esbuild: ^0.28.2
  eslint: ^10.11.0
  eslint-plugin-format: ^2.0.1
  jiti: ^2.7.0
  known-css-properties: ^0.37.0
  lightningcss: ^1.33.0
  lint-staged: ^17.6.0
  nuxt: 4.5.2
  obuild: ^0.4.40
  oxc-parser: ^0.151.0
  pug: ^3.0.4
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  turbo: 2.11.5
  type-fest: ^5.10.0
  # @typescript-eslint 8.x supports TypeScript < 6.1; do not upgrade to 7 yet.
  typescript: ^6.0.3
  unplugin-auto-import: ^21.1.0
  vite: 8.3.1
  vitefu: ^1.1.3
  vitest: ^5.0.3
  vue: ^3.5.43
  vue-tsc: ^3.3.11
  wxt: ^0.21.4

# Published compatibility contracts are deliberately broader than the exact
# versions above that exercise the maintainer workspace and release gates.
catalogs:
  # The review experiment owns the requested Nuxt 4.6 host, not the default reference.
  nuxt46:
    nuxt: 4.6.0
    postcss: 8.5.29
    vite: 8.3.4
  peers:
    '@mszr/selenita': '>=0.3.0 <0.5.0'
    '@nuxt/kit': '>=4.4.8 <5.0.0'
    '@nuxt/schema': '>=4.4.8 <5.0.0'
    nuxt: '>=4.4.8 <5.0.0'
    typescript: '>=6.0.3 <7.0.0'
    vite: '^6.0.0 || ^7.0.0 || ^8.0.0'
    vitest: ^5.0.3
    vue: ^3.5.39
    wxt: '>=0.21.4 <1.0.0'
  # Review host aliases are isolated from the default compiler host.
  reviewHosts:
    vite6: npm:vite@6.4.4
    vite7: npm:vite@7.3.7
  # This experiment owns Vite 6 HTML-hook behavior, not the default host matrix.
  vite6:
    vite: 6.4.3
